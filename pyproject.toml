[project]
name = "opus"
version = "0.1.0"
description = "OracleMD GPU free-energy engine - M0 structural-isomorphic reference implementation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openmm>=8.1",
]

[dependency-groups]
dev = [
    "mpmath>=1.4.1",
    "pytest>=8.0",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
